services:
  influxdb3:
    image: influxdb:3-core
    command:
      - influxdb3
      - serve
      - --node-id
      - primary-node
      - --object-store
      - file
      - --data-dir
      - /var/lib/influxdb3/data
      - --admin-token-file
      - /run/secrets/influxdb3-admin-token
    ports:
      - 127.0.0.1:8181:8181
    secrets:
      - influxdb3-admin-token
    volumes:
      - type: volume
        source: influxdb3-data
        target: /var/lib/influxdb3
  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - influxdb3
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_FEATURE_TOGGLES_ENABLE: newInfluxDSConfigPageDesign
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 500ms
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
    restart: unless-stopped

secrets:
  influxdb3-admin-token:
    file: ${INFLUXDB3_ADMIN_TOKEN_FILE:-./influxdb3-admin-token.json}

volumes:
  influxdb3-data:
  grafana-data:
