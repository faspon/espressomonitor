apiVersion: 1
datasources:
  - name: ${GRAFANA_DATA_SRC_NAME}
    type: influxdb
    access: proxy
    url: http://${INFLUXDB_HOST}:${INFLUXDB_PORT}
    jsonData:
      version: SQL
      dbName: ${INFLUXDB_NAME}
      insecureGrpc: true
    secureJsonData:
      token: $INFLUXDB3_ADMIN_TOKEN
    isDefault: true
    editable: true